# Configuração do gitleaks (Blueprint seção 6: secret scanning na CI).
#
# Estende as regras padrão em vez de substituí-las.
[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Por que só `[[allowlists]]` e nenhum `[[rules]]`
#
# A tentação é declarar `[[rules]] id = "generic-api-key"` com um allowlist
# dentro. Isso NÃO estende a regra padrão: substitui. Como o bloco não traria
# `regex`, a regra passaria a não detectar nada — e o scanner ficaria verde por
# estar cego, que é pior do que falhar.
#
# Allowlists globais são aditivas: as regras padrão continuam inteiras, e apenas
# os casos descritos abaixo deixam de ser reportados.
#
# Achados históricos pontuais ficam no `.gitleaksignore`, por fingerprint —
# mecanismo mais preciso ainda, porque vale para um único commit.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Credenciais de banco efêmero
#
# O `docker-compose.yml`, o workflow de CI e os testes de integração usam a
# senha literal `lapato` contra um Postgres que só existe dentro do runner ou da
# máquina do desenvolvedor. Não há segredo a proteger.
#
# Segredos de produção vêm do secret manager, nunca do repositório
# (Blueprint seção 5). O `.env.example` não entra aqui: seus campos sensíveis
# são deixados VAZIOS justamente para não haver o que permitir.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Credenciais de banco efêmero usadas em CI e testes de integração"
paths = [
  '''^\.github/workflows/ci\.yml$''',
  '''^infra/docker-compose\.yml$''',
  '''.*\.test\.ts$''',
]

# ---------------------------------------------------------------------------
# Documentação
#
# Os ADRs e o README citam nomes de variáveis e exemplos de configuração. São
# arquivos de texto explicativo, sem credencial.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Documentação de arquitetura"
paths = [
  '''^docs/.*\.md$''',
  '''^README\.md$''',
]
