# =============================================================================
# LAPATO - ambiente local e base para VPS (Engineering Blueprint secao 5)
#
# Superficie minima exposta: apenas o Caddy publica portas no host.
# Postgres, Redis, MinIO, API e worker ficam na rede privada `lapato-interna`
# e sao alcancaveis somente por nome de servico dentro dela.
# =============================================================================

name: lapato

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    # UNICO servico com portas publicadas (Blueprint secao 5: "so 443 publico")
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [lapato-interna]
    depends_on: [api, web]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lapato}
      # O container sobe com o usuario dono do schema; o usuario da aplicacao
      # (sem BYPASSRLS) e criado pelo script de inicializacao.
      POSTGRES_USER: ${POSTGRES_MIGRATOR_USER:-lapato_owner}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?defina no .env}
      APP_DB_USER: ${POSTGRES_USER:-lapato_app}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [lapato-interna]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_MIGRATOR_USER:-lapato_owner} -d ${POSTGRES_DB:-lapato}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    networks: [lapato-interna]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-lapato-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?defina no .env}
    volumes:
      - minio-data:/data
    networks: [lapato-interna]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Cria o bucket privado uma vez e encerra.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      S3_BUCKET: ${S3_BUCKET:-lapato}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-lapato-dev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?defina no .env}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set none local/$${S3_BUCKET} &&
      echo 'bucket privado pronto'
      "
    networks: [lapato-interna]
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    env_file: [../.env]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    networks: [lapato-interna]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    env_file: [../.env]
    networks: [lapato-interna]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    networks: [lapato-interna]

networks:
  lapato-interna:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
