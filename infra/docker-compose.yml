# =============================================================================
# LAPATO - ambiente de DESENVOLVIMENTO local.
#
# Producao NAO usa este arquivo nem Compose nenhum: cada servico e um recurso
# proprio no Coolify, construido a partir do seu Dockerfile. Ver
# `docs/deploy-coolify.md`.
#
# O que este arquivo existe para dar, e que a maquina do desenvolvedor nao tem
# de graca: um Postgres descartavel, o mesmo Node da imagem de producao e -
# principalmente - front e API no MESMO host. Essa ultima parte importa: o
# cookie de sessao e host-only e o CSRF depende de `SameSite=Lax`, entao
# desenvolver em duas origens diferentes esconderia bugs que so aparecem depois.
#
# Superficie exposta: apenas o Caddy publica portas. O Postgres fica na rede
# interna - se um dia aparecer `5432` aberta no host, e regressao.
# =============================================================================

name: lapato

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [lapato-interna]
    depends_on: [api, web]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lapato}
      # O container sobe com o usuario dono do schema; o usuario da aplicacao
      # (sem BYPASSRLS) e criado pelo script de inicializacao.
      POSTGRES_USER: ${POSTGRES_MIGRATOR_USER:-lapato_owner}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?defina no .env}
      APP_DB_USER: ${POSTGRES_USER:-lapato_app}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [lapato-interna]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_MIGRATOR_USER:-lapato_owner} -d ${POSTGRES_DB:-lapato}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    env_file: [../.env]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # O Caddy repassa o caminho inteiro, sem consumir o `/api`.
      API_GLOBAL_PREFIX: api/v1
    networks: [lapato-interna]
    depends_on:
      postgres: { condition: service_healthy }
    # Sem `healthcheck` aqui de proposito: vale o do `Dockerfile.api`, que deriva
    # o caminho de `API_GLOBAL_PREFIX`. Repetir a definicao criaria duas versoes
    # da mesma verdade, e foi assim que a de producao ficou para tras.

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    env_file: [../.env]
    networks: [lapato-interna]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    networks: [lapato-interna]

networks:
  lapato-interna:
    driver: bridge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
