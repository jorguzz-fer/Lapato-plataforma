# Cabecalhos de seguranca da SPA (Blueprint secao 6).
#
# O `helmet` da API nao cobre isto: quem carrega e executa JavaScript e esta
# origem, servida pelo nginx. Sem CSP, um XSS aqui teria a pagina inteira.
#
# Fica fora de `conf.d/` de proposito: o nginx da imagem base faz
# `include /etc/nginx/conf.d/*.conf` no nivel `http`, e um arquivo la dentro
# seria carregado sozinho tambem, duplicando cada cabecalho.
#
# Este arquivo e incluido no `server` E em cada `location` de proposito: no
# nginx, um `location` que declara qualquer `add_header` proprio deixa de herdar
# os do nivel de cima. Os dois `location` do site definem `Cache-Control`, entao
# sem o include eles perderiam tudo o que esta aqui.

# `style-src` precisa de 'unsafe-inline': o Emotion, que o Material UI usa,
# injeta as regras em <style> em tempo de execucao. `script-src 'self'` nao tem
# essa concessao - o bundle e servido como arquivo.
# `blob:` e `data:` em img-src: a galeria do M16 gera miniatura em canvas antes
# de enviar, e a pre-visualizacao do PDF do laudo vem como blob.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Clickjacking: nenhuma tela do LAPATO e feita para viver dentro de iframe.
add_header X-Frame-Options "DENY" always;
# Impede o navegador de adivinhar o tipo de um arquivo servido pela aplicacao.
add_header X-Content-Type-Options "nosniff" always;
# O identificador do caso viaja na URL; nao deve vazar para terceiros.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# `camera=(self)` existe para a captura pela webcam fixa da bancada (M16):
# recebimento, macroscopia e a digitalizacao da requisicao fotografam direto
# da tela, sem tocar na camera. Microfone entra como `(self)` quando a
# necropsia por voz (M14) usar audio; localizacao e pagamento seguem fechados.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
